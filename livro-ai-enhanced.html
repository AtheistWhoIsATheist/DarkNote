<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paralyzing Nihilism - AI Enhanced</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #e0e0e0;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 25px;
      background: rgba(40, 40, 40, 0.9);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
      position: relative;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .nav-button {
      margin-right: 25px;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 18px;
      color: #8b8b8b;
      transition: color 0.3s ease;
    }

    .nav-button:hover {
      color: #e0e0e0;
    }

    .page-title {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 1px;
      color: #d4d4d4;
    }

    .ai-toggle {
      background: linear-gradient(135deg, #5A6B73 0%, #8B9DC3 100%);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(90, 107, 115, 0.3);
    }

    .ai-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(90, 107, 115, 0.5);
    }

    .nav-links {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 60px;
      left: 25px;
      background: rgba(50, 50, 50, 0.95);
      border-radius: 8px;
      z-index: 10;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .nav-links a {
      padding: 12px 20px;
      text-decoration: none;
      color: #a0a0a0;
      border-bottom: 1px solid rgba(80, 80, 80, 0.3);
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      background: rgba(90, 107, 115, 0.2);
      color: #e0e0e0;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .journal-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 20px;
      flex-wrap: wrap;
    }

    .controls button {
      background: none;
      border: 1px solid #444;
      color: #ccc;
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Courier New', monospace;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border-color: #666;
    }

    #journal-container {
      flex: 1;
      padding: 20px;
      margin: 0 20px 20px;
      border-radius: 8px;
      background: rgba(25, 25, 25, 0.8);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.2);
      overflow-y: auto;
      position: relative;
    }

    #journal-editor,
    #markdown-preview {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      color: #e0e0e0;
      font-size: 16px;
      line-height: 1.6;
      font-family: 'Courier New', monospace;
      resize: none;
    }

    #journal-editor:focus {
      outline: none;
    }

    #journal-editor::placeholder {
      color: #666;
      font-style: italic;
    }

    #markdown-preview {
      display: none;
      overflow-y: auto;
      padding: 10px;
    }

    #markdown-preview h1, #markdown-preview h2, #markdown-preview h3,
    #markdown-preview h4, #markdown-preview h5, #markdown-preview h6 {
      color: #8B9DC3;
      margin: 20px 0 10px 0;
    }

    #markdown-preview strong {
      color: #5A6B73;
    }

    #markdown-preview em {
      color: #a0a0a0;
      font-style: italic;
    }

    /* AI Panel Styles */
    .ai-panel {
      width: 400px;
      background: rgba(40, 40, 40, 0.95);
      border-left: 2px solid #5A6B73;
      display: none;
      flex-direction: column;
      backdrop-filter: blur(10px);
      box-shadow: -8px 0 25px rgba(0, 0, 0, 0.3);
    }

    .ai-panel.active {
      display: flex;
    }

    .ai-header {
      padding: 20px;
      background: linear-gradient(135deg, #5A6B73 0%, #8B9DC3 100%);
      color: white;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .ai-tools {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .ai-tool {
      border-bottom: 1px solid rgba(90, 107, 115, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .ai-tool:hover {
      background: rgba(90, 107, 115, 0.1);
    }

    .ai-tool-header {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: none;
      background: none;
      color: #e0e0e0;
      width: 100%;
      text-align: left;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
    }

    .ai-tool-icon {
      font-size: 18px;
      color: #8B9DC3;
    }

    .ai-tool-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: rgba(25, 25, 25, 0.5);
    }

    .ai-tool.expanded .ai-tool-content {
      max-height: 500px;
    }

    .ai-tool-inner {
      padding: 20px;
    }

    .ai-input {
      width: 100%;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid #5A6B73;
      color: #e0e0e0;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-bottom: 12px;
      resize: vertical;
      min-height: 80px;
    }

    .ai-input:focus {
      outline: none;
      border-color: #8B9DC3;
      box-shadow: 0 0 8px rgba(139, 157, 195, 0.3);
    }

    .ai-button {
      background: linear-gradient(135deg, #5A6B73 0%, #8B9DC3 100%);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      transition: all 0.3s ease;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .ai-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(90, 107, 115, 0.4);
    }

    .ai-output {
      background: rgba(25, 25, 25, 0.8);
      border: 1px solid #444;
      color: #e0e0e0;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 12px;
      white-space: pre-wrap;
    }

    .copy-button {
      background: rgba(90, 107, 115, 0.3);
      border: 1px solid #5A6B73;
      color: #8B9DC3;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      margin-top: 8px;
      transition: all 0.3s ease;
    }

    .copy-button:hover {
      background: rgba(90, 107, 115, 0.5);
      color: #e0e0e0;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: rgba(40, 40, 40, 0.9);
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
    }

    .footer-text {
      font-size: 14px;
      color: #8b8b8b;
      font-style: italic;
    }

    .arrows {
      display: flex;
      gap: 15px;
    }

    .arrow {
      cursor: pointer;
      font-size: 16px;
      color: #8b8b8b;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .arrow:hover {
      color: #8B9DC3;
    }

    /* Loading animation */
    .ai-loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(139, 157, 195, 0.3);
      border-radius: 50%;
      border-top-color: #8B9DC3;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive design */
    @media (max-width: 900px) {
      .ai-panel {
        width: 350px;
      }
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      
      .ai-panel {
        width: 100%;
        max-height: 50vh;
        border-left: none;
        border-top: 2px solid #5A6B73;
      }
      
      header {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }
      
      .header-left {
        width: 100%;
        justify-content: space-between;
      }
      
      footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(40, 40, 40, 0.5);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(90, 107, 115, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(90, 107, 115, 0.7);
    }
  </style>
</head>
<body>

    <div class="header-left">

The void beckons. Your thoughts await manifestation in this digital realm of philosophical contemplation. 

What profound insights emerge from the depths of your consciousness today?"></textarea>

        <!-- Expand Thoughts -->

        <!-- Counter-Perspective -->

        <!-- Concept Explorer -->

              <textarea class="ai-input" placeholder="Enter a philosophical concept to explore in depth..."></textarea>
              <button class="ai-button" onclick="exploreConcept(this)">Explore</button>

          <button class="ai-tool-header" onclick="toggleTool(this)">
            <span class="ai-tool-icon">🎯</span>

          <div class="ai-tool-content">
            <div class="ai-tool-inner">
              <textarea class="ai-input" placeholder="Paste long text to create a philosophical summary..."></textarea>

            </div>

        </div>

        <!-- Generate Tags -->
        <div class="ai-tool">
          <button class="ai-tool-header" onclick="toggleTool(this)">
            <span class="ai-tool-icon">🏷️</span>

          </button>
          <div class="ai-tool-content">
            <div class="ai-tool-inner">
              <textarea class="ai-input" placeholder="Paste text to generate relevant philosophical tags..."></textarea>
              <button class="ai-button" onclick="generateTags(this)">Generate Tags</button>

  <footer>
    <div class="footer-text">The Religious Experience of Nihilism</div>
    <div class="arrows">
      <a href="#prev" class="arrow" onclick="previousPage()">← Previous</a>
      <a href="#next" class="arrow" onclick="nextPage()">Next →</a>
    </div>
  </footer>

  <script>
    // Core app state
    const editor = document.getElementById('journal-editor');
    const preview = document.getElementById('markdown-preview');
    const aiPanel = document.getElementById('aiPanel');
    
    let currentPage = 'page1';
    let isAIOpen = false;

    // Navigation functions
    function toggleNav() {
      const nav = document.getElementById('navLinks');
      nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleAI() {
      isAIOpen = !isAIOpen;
      aiPanel.classList.toggle('active', isAIOpen);
      document.querySelector('.ai-toggle').textContent = isAIOpen ? '✖ Close AI' : '🧠 AI Assistant';
    }

    function toggleTool(button) {
      const tool = button.parentElement;
      const isExpanded = tool.classList.contains('expanded');
      
      // Close all other tools
      document.querySelectorAll('.ai-tool.expanded').forEach(t => {
        if (t !== tool) t.classList.remove('expanded');
      });
      
      // Toggle current tool
      tool.classList.toggle('expanded', !isExpanded);
    }

    // Core editor functions
    function togglePreview() {
      if (preview.style.display === 'block') {
        preview.style.display = 'none';
        editor.style.display = 'block';
      } else {
        const text = editor.value;
        preview.innerHTML = renderMarkdown(text);
        preview.style.display = 'block';
        editor.style.display = 'none';
      }
    }

    function renderMarkdown(md) {
      return md
        .replace(/^###### (.*$)/gim, '<h6>$1</h6>')
        .replace(/^##### (.*$)/gim, '<h5>$1</h5>')
        .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em>$1</em>')
        .replace(/\n\n/gim, '</p><p>')
        .replace(/\n/gim, '<br>')
        .replace(/^(.*)/, '<p>$1')
        .replace(/(.*$)/, '$1</p>');
    }

    function exportMarkdown() {
      const timestamp = new Date().toISOString().slice(0,10);
      const blob = new Blob([editor.value], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nihil-notes-${timestamp}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearEditor() {
      if (confirm('Clear all content? This cannot be undone.')) {
        editor.value = '';
        saveToStorage();
      }
    }

    function insertTimestamp() {
      const timestamp = new Date().toLocaleString();
      const text = `\n\n---\n${timestamp}\n\n`;
      insertAtCursor(text);
    }

    function insertAtCursor(text) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const value = editor.value;
      editor.value = value.slice(0, start) + text + value.slice(end);
      editor.selectionStart = editor.selectionEnd = start + text.length;
      editor.focus();
      saveToStorage();
    }

    // Page management
    function selectPage(pageId) {
      // Save current page
      saveToStorage();
      
      // Switch to new page
      currentPage = pageId;
      loadFromStorage();
      
      // Close nav
      document.getElementById('navLinks').style.display = 'none';
    }

    function previousPage() {
      const pages = ['page1', 'page2', 'page3'];
      const current = pages.indexOf(currentPage);
      const prev = current > 0 ? pages[current - 1] : pages[pages.length - 1];
      selectPage(prev);
    }

    function nextPage() {
      const pages = ['page1', 'page2', 'page3'];
      const current = pages.indexOf(currentPage);
      const next = current < pages.length - 1 ? pages[current + 1] : pages[0];
      selectPage(next);
    }

    // Storage functions
    function saveToStorage() {
      localStorage.setItem(`nihilNotes_${currentPage}`, editor.value);
    }

    function loadFromStorage() {
      const saved = localStorage.getItem(`nihilNotes_${currentPage}`);
      editor.value = saved || '';
    }

    // AI Functions with sophisticated philosophical responses
    
    const philosophicalResponses = {
      expandThoughts: [
        "The paradox of existence reveals itself in the tension between our desperate search for meaning and the universe's apparent indifference to our plight. Consider how this very act of seeking meaning might itself be the meaning we seek—a recursive loop of consciousness examining itself, like Ouroboros consuming its own tail in an eternal dance of self-reflection.",
        
        "What emerges here is the fundamental contradiction of human consciousness: we are beings capable of conceiving infinity while trapped within finite existence. This cognitive dissonance creates the space where philosophy flourishes—in the gap between what we can imagine and what we can actually comprehend.",
        
        "The absurdity lies not in the lack of inherent meaning, but in our persistent belief that meaning must be inherent rather than constructed. We are architects of significance in a universe that provides only raw materials—consciousness, time, and the strange capacity to question our own questioning."
      ],
      
      generateIdeas: [

    // AI Function implementations
    function showLoading(container) {
      const output = container.querySelector('.ai-output');
      output.style.display = 'block';
      output.innerHTML = '<div class="ai-loading"></div> Contemplating the depths of existence...';
    }

    function showOutput(container, content) {
      const output = container.querySelector('.ai-output');
      output.innerHTML = content;
      addCopyButton(output);
    }

    function addCopyButton(output) {
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-button';
      copyBtn.textContent = 'Copy to clipboard';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(output.textContent.replace('Copy to clipboard', '').trim());
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy to clipboard', 2000);
      };
      output.appendChild(copyBtn);
    }

    function insertOutput(output) {
      const text = output.textContent.replace('Copy to clipboard', '').trim();
      insertAtCursor('\n\n' + text + '\n\n');
    }

            e.target.appendChild(insertBtn);

        }
      });
      
      // Close nav when clicking outside
      document.addEventListener('click', (e) => {
        const nav = document.getElementById('navLinks');

          nav.style.display = 'none';

    // Keyboard shortcuts

      if (e.ctrlKey || e.metaKey) {
